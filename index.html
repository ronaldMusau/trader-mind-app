<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Trader Mind</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="config.js"></script>
<script src="lib/supabase.js"></script>
<script src="lib/marked.min.js"></script>
<script src="lib/purify.min.js"></script>
<style>
:root{--bg:#0b1016;--bg2:#0f1620;--card:#141d28;--card2:#182333;--line:#223043;--ink:#eaf0f6;--soft:#8fa0b3;--dim:#5d6f84;
--green:#34d399;--red:#f87171;--amber:#fbbf24;--blue:#60a5fa;--violet:#a78bfa;--gold:#f5c451}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#17263a 0%,var(--bg) 55%) fixed;color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(11,16,22,.82);backdrop-filter:blur(10px);padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.live{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 9px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.grow{flex:1}.soft{color:var(--soft)}.dim{color:var(--dim)}small{font-size:12px}
.iconbtn{background:var(--card);border:1px solid var(--line);border-radius:10px;width:34px;height:34px;display:grid;place-items:center}
main{padding:12px 14px 100px;max-width:760px;margin:auto}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.k{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid2 .card{margin:0}
.pos{color:var(--green)}.neg{color:var(--red)}.amb{color:var(--amber)}.blu{color:var(--blue)}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.04em}
.pill.buy{background:rgba(52,211,153,.15);color:var(--green)}.pill.sell{background:rgba(248,113,113,.15);color:var(--red)}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--soft);background:none}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ico.stock{background:rgba(96,165,250,.14)}.ico.forex{background:rgba(52,211,153,.14)}.ico.commodity{background:rgba(245,196,81,.14)}.ico.crypto{background:rgba(167,139,250,.14)}
.pending{position:relative;border:1px solid rgba(251,191,36,.55);background:linear-gradient(135deg,rgba(251,191,36,.16),rgba(251,191,36,.04))}
.pending:before{content:"";position:absolute;inset:-1px;border-radius:18px;border:2px solid rgba(251,191,36,.6);animation:glow 1.6s ease-in-out infinite;pointer-events:none}
@keyframes glow{50%{opacity:.15}}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px}
.btn.ok{background:var(--green);color:#052e1f}.btn.no{background:#2a1416;color:var(--red);border:1px solid rgba(248,113,113,.4)}
.btn:active{transform:scale(.98)}
.range{position:relative;height:10px;border-radius:6px;background:linear-gradient(90deg,rgba(248,113,113,.35),rgba(255,255,255,.06) 45%,rgba(52,211,153,.35));margin:14px 0 6px}
.range .mk{position:absolute;top:-5px;width:3px;height:20px;border-radius:2px;background:var(--ink);transition:left 1s cubic-bezier(.2,.8,.2,1)}
.range .en{position:absolute;top:-3px;width:2px;height:16px;background:var(--dim)}
.range-l{display:flex;justify-content:space-between;font-size:11px;color:var(--soft)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:rgba(9,13,18,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--dim);padding:9px 0 8px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav button.on{color:var(--ink)}nav button.on svg{stroke:var(--green)}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--amber);color:#1a1300;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;animation:bump .6s ease}
@keyframes bump{50%{transform:scale(1.3)}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-size:11px;opacity:.7}
.md{font-size:14px}.md h1,.md h2,.md h3{font-size:15px;margin:12px 0 6px}.md table{border-collapse:collapse;font-size:12px;display:block;overflow-x:auto}
.md td,.md th{border:1px solid var(--line);padding:4px 6px}.md code{background:#0b1118;padding:1px 4px;border-radius:4px}.md ul{padding-left:18px}
.tl{position:relative;padding-left:20px}.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl .dot{position:absolute;left:-19px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(52,211,153,.15)}
input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#0b1118;color:var(--ink);font-size:16px;margin-top:10px}
.hidden{display:none!important}
.empty{text-align:center;padding:26px 10px;color:var(--soft)}
.shimmer{background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:12px;height:16px;margin:8px 0}
@keyframes sh{to{background-position:-200% 0}}
.flash{animation:flash 1.6s ease 2}@keyframes flash{50%{box-shadow:0 0 0 3px var(--amber)}}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;animation:rise .3s ease}
</style>
</head>
<body>
<header>
  <svg width="26" height="26" viewBox="0 0 512 512"><rect width="512" height="512" rx="120" fill="#13202e"/><polyline points="96,340 196,250 266,300 416,150" fill="none" stroke="#34d399" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><circle cx="416" cy="150" r="28" fill="#eaf0f6"/></svg>
  <h1>Trader Mind</h1><span class="live" title="live"></span>
  <span class="grow"></span><small id="updated" class="soft"></small>
  <button class="iconbtn" id="refresh" aria-label="Refresh"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
</header>
<main>
  <section id="login" class="hidden card">
    <div class="k">Sign in</div>
    <p class="soft">Enter your email. A sign-in link arrives in your inbox; open it on this phone.</p>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <button class="btn ok" style="width:100%;margin-top:10px" id="send">Send sign-in link</button>
    <p id="loginmsg" class="soft"></p>
  </section>

  <div id="pendingBox"></div>

  <section id="v-home" class="view hidden">
    <div class="card" id="hero"><div class="shimmer"></div><div class="shimmer" style="width:60%"></div></div>
    <div class="card hidden" id="liveAcct"></div>
    <div class="grid2" id="gauges"></div>
    <div class="grid2" id="classes" style="margin-top:12px"></div>
    <div id="openList"></div>
    <div class="card" id="lastj"></div>
  </section>

  <section id="v-trades" class="view hidden">
    <div class="chips" id="cls"></div>
    <div class="chips" id="sts"></div>
    <div id="tlist"></div>
  </section>

  <section id="v-results" class="view hidden">
    <div class="chips" id="rcls"></div>
    <div class="card" id="rhero"></div>
    <div class="grid2" id="rsplit"></div>
    <div class="card"><div class="k">Last 14 days</div><div id="rdays"></div></div>
    <div class="card"><div class="k">By market</div><div id="rclass"></div></div>
    <div class="card" id="rbest"></div>
  </section>

  <section id="v-journal" class="view hidden"><div id="jlist" class="tl"></div></section>

  <section id="v-rules" class="view hidden">
    <div class="card"><div class="k">Process score per session</div><div id="scoreChart"></div><small class="soft">Gate: 95%+ for 10 sessions in a row before real money is even discussed.</small></div>
    <div class="card"><div class="k">Lessons learned</div><div id="lessons" class="md"></div></div>
  </section>
</main>

<nav id="nav" class="hidden">
  <button data-v="home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Overview</button>
  <button data-v="trades"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M22 19H2"/></svg>Trades<span class="badge hidden" id="badge">0</span></button>
  <button data-v="results"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Results</button>
  <button data-v="journal"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z"/><path d="M8 9h8M8 13h6"/></svg>Journal</button>
  <button data-v="rules"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Scores</button>
</nav>

<script>
const sb = supabase.createClient(window.TM.SUPABASE_URL, window.TM.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md = s => DOMPurify.sanitize(marked.parse(s || ""));
const money = (v, sign=true) => v==null ? "—" : (sign && v>0 ? "+" : v<0 ? "−" : "") + "$" + Math.abs(+v).toFixed(2);
const CLASSES = {all:"All", stock:"Stocks", forex:"Forex", commodity:"Commodities", crypto:"Crypto"};
const STATUSES = {all:"All", open:"Open", proposed:"Waiting", closed:"Closed", cancelled:"History"};
const ICON = {
  stock:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round"><path d="M6 3v4M6 15v6M18 3v6M18 17v4M12 6v3M12 17v4"/><rect x="4" y="7" width="4" height="8" rx="1"/><rect x="16" y="9" width="4" height="8" rx="1"/><rect x="10" y="9" width="4" height="8" rx="1"/></svg>`,
  forex:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>`,
  commodity:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f5c451" stroke-width="2" stroke-linejoin="round"><path d="M3 18l3-8h12l3 8z"/><path d="M8 10l2-5h4l2 5"/></svg>`,
  crypto:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M10 8h3.5a2 2 0 0 1 0 4H10zM10 12h4a2 2 0 0 1 0 4h-4zM10 7v10M12 6v2M12 16v2"/></svg>`};
let state = {rcls:"all", live:null, liveAt:0, cls:"all", st:"all", trades:[], approvals:{}, snap:{}, journal:[], view:"home", seen: JSON.parse(localStorage.getItem("tm_seen")||"{}")};

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
function show(v){state.view=v;if(v==="results")renderResults();document.querySelectorAll(".view").forEach(e=>e.classList.add("hidden"));$("#v-"+v).classList.remove("hidden");
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));window.scrollTo({top:0,behavior:"smooth"});}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));
$("#refresh").onclick=()=>{load();toast("Refreshed");};

$("#send").onclick = async () => {
  const email = $("#email").value.trim(); if(!email) return;
  const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo: location.href.split("#")[0], shouldCreateUser:false}});
  $("#loginmsg").textContent = error ? ("Could not send: " + error.message) : "Link sent. Check your email on this phone.";
};

function pendings(){ return state.trades.filter(t=>t.mode==="demo"&&t.status==="proposed"&&t.expires_at&&new Date(t.expires_at)>Date.now()&&!state.approvals[t.id]); }
function mmss(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+":"+String(s).padStart(2,"0");}
function renderPending(){
  const p = pendings();
  $("#badge").textContent = p.length; $("#badge").classList.toggle("hidden", !p.length);
  document.title = (p.length?`(${p.length}) `:"")+"Trader Mind";
  try{ p.length ? navigator.setAppBadge?.(p.length) : navigator.clearAppBadge?.(); }catch(e){}
  $("#pendingBox").innerHTML = p.map(t=>`<div class="card pending" id="pend-${esc(t.id)}">
    <div class="row between"><div class="k amb">Waiting for your yes · demo</div><div class="timer amb" data-exp="${esc(t.expires_at)}">${mmss(new Date(t.expires_at)-Date.now())}</div></div>
    <div class="row" style="margin-top:10px"><div class="ico ${t.asset_class}">${ICON[t.asset_class]}</div>
      <div class="grow"><div style="font-weight:800;font-size:18px">${esc(t.instrument.replace("_","/"))} <span class="pill ${t.side}">${t.side.toUpperCase()}</span></div>
      <small class="soft">Entry ${esc(t.entry)} · Stop ${esc(t.stop)} · Target ${esc(t.target)}</small></div></div>
    <div class="row between" style="margin-top:10px"><span class="soft">Risk if stopped</span><b class="neg">${money(-Math.abs(t.risk_usd||0))}</b></div>
    <div class="row between"><span class="soft">If target hit</span><b class="pos">${t.risk_usd? money(Math.abs(t.risk_usd)*((Math.abs(t.target-t.entry)/Math.abs(t.entry-t.stop))||0)) : "—"}</b></div>
    <div class="btns"><button class="btn no" onclick="decide('${esc(t.id)}','reject')">Reject</button><button class="btn ok" onclick="decide('${esc(t.id)}','approve')">Approve</button></div>
  </div>`).join("");
}
setInterval(()=>{document.querySelectorAll(".timer[data-exp]").forEach(el=>{const ms=new Date(el.dataset.exp)-Date.now();el.textContent=mmss(ms);if(ms<=0)renderPending();});},1000);

async function decide(id, decision){
  const t = state.trades.find(x=>x.id===id); if(!t) return;
  const {error} = await sb.from("approvals").insert({trade_id:id, fingerprint:t.fingerprint, decision});
  if(error){ toast("Not saved: "+error.message); return; }
  state.approvals[id]={decision,decided_at:new Date().toISOString()};
  renderPending(); toast(decision==="approve"?"Approved ✓ placing on demo after a risk check":"Rejected: nothing will be placed");
  if(navigator.vibrate) navigator.vibrate(40);
}

function areaChart(points){
  const W=320,H=90; if(points.length<2) points=[0,...points,points.at(-1)||0];
  const min=Math.min(0,...points),max=Math.max(0,...points),span=(max-min)||1;
  const xy=points.map((v,i)=>[i*(W/(points.length-1)), H-6-(v-min)/span*(H-12)]);
  const d="M"+xy.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" L");
  const up=points.at(-1)>=0, col=up?"#34d399":"#f87171", zero=H-6-(0-min)/span*(H-12);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
   <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
   <line x1="0" x2="${W}" y1="${zero}" y2="${zero}" stroke="#223043" stroke-dasharray="3 4"/>
   <path d="${d} L${W},${H} L0,${H} Z" fill="url(#ag)"/>
   <path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.2s" fill="freeze"/></path>
   <circle cx="${xy.at(-1)[0]}" cy="${xy.at(-1)[1]}" r="4" fill="${col}"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle></svg>`;
}
function gauge(value, label, sub, col, id){
  const v=Math.max(0,Math.min(100,value??0)), cx=60, cy=60, r=46;
  return `<div class="card"><div class="k">${label}</div>
   <svg viewBox="0 0 120 72" width="100%" height="90"><defs><linearGradient id="gg${id}" x1="0" x2="1"><stop offset="0" stop-color="#f87171"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
    <path d="M14 60 A46 46 0 0 1 106 60" fill="none" stroke="#223043" stroke-width="10" stroke-linecap="round"/>
    <path d="M14 60 A46 46 0 0 1 106 60" fill="none" stroke="url(#gg${id})" stroke-width="10" stroke-linecap="round" opacity=".9"/>
    <line class="needle" x1="${cx}" y1="${cy}" x2="${cx-r+6}" y2="${cy}" stroke="#eaf0f6" stroke-width="3" stroke-linecap="round" data-deg="${v*1.8}" style="transform-origin:60px 60px;transform:rotate(0deg);transition:transform 1.4s cubic-bezier(.2,.8,.2,1)"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#eaf0f6"/></svg>
   <div style="font-weight:800;font-size:18px;margin-top:-6px" class="${col}">${esc(sub)}</div><small class="soft">${value==null?"not checked yet":Math.round(v)+" / 100"}</small></div>`;
}
function ring(pct,col){const c=2*Math.PI*16,o=c*(1-(pct||0)/100);return `<svg width="44" height="44" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#223043" stroke-width="5"/><circle cx="20" cy="20" r="16" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" transform="rotate(-90 20 20)"><animate attributeName="stroke-dashoffset" from="${c}" to="${o}" dur="1.2s" fill="freeze"/></circle><text x="20" y="24" text-anchor="middle" font-size="10" fill="#eaf0f6" font-weight="700">${pct==null?"–":pct+"%"}</text></svg>`;}
function countUp(el,to){const t0=performance.now(),d=900;(function f(t){const k=Math.min(1,(t-t0)/d),v=to*(1-Math.pow(1-k,3));el.textContent=money(v);if(k<1)requestAnimationFrame(f);})(t0);}

function rangeBar(t){
  if(t.stop==null||t.target==null) return "";
  const lo=Math.min(t.stop,t.target), hi=Math.max(t.stop,t.target); if(!(hi>lo)) return "";
  const pos=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
  const now=t.last_price??t.exit??t.entry; const flip=t.side==="sell";
  const L=v=>flip?100-pos(v):pos(v);
  return `<div class="range"><div class="en" style="left:${L(t.entry)}%"></div><div class="mk" style="left:calc(${L(now)}% - 1px)"></div></div>
   <div class="range-l"><span>stop ${esc(t.stop)}</span><span>${t.last_price?"now "+esc(t.last_price):t.exit?"exit "+esc(t.exit):"entry "+esc(t.entry)}</span><span>target ${esc(t.target)}</span></div>`;
}
function tradeCard(t){
  const right = t.status==="closed" ? `<b class="${t.result==="win"?"pos":"neg"}">${money(t.pnl_usd)}</b>`
    : t.status==="open" ? (t.upl_usd!=null?`<b class="${t.upl_usd>=0?"pos":"neg"}">${money(t.upl_usd)}</b>`:`<span class="blu">open</span>`)
    : t.status==="proposed" ? `<span class="amb">waiting</span>` : `<span class="dim">history</span>`;
  return `<div class="card" id="t-${esc(t.id)}"><div class="row"><div class="ico ${t.asset_class}">${ICON[t.asset_class]}</div>
    <div class="grow"><div style="font-weight:700">${esc(t.instrument.replace("_","/"))} <span class="pill ${t.side}">${t.side.toUpperCase()}</span></div>
    <small class="soft">${esc(t.mode==="shadow"?"study (no order)":t.mode==="demo"?"demo account":t.mode)}${t.setup?" · "+esc(t.setup):""}${t.r!=null?" · "+(t.r>0?"+":"")+(+t.r).toFixed(2)+"R":""}</small></div>${right}</div>
    ${t.status!=="cancelled"?rangeBar(t):""}
    ${t.expectation?`<div class="soft" style="margin-top:8px;font-size:13px">${esc(t.expectation)}</div>`:""}
    <small class="dim">${t.opened_at?new Date(t.opened_at).toLocaleString():""}</small></div>`;
}

function renderHome(){
  const closed=state.trades.filter(t=>t.status==="closed").sort((a,b)=>new Date(a.closed_at)-new Date(b.closed_at));
  let cum=0; const curve=closed.map(t=>cum+=+(t.pnl_usd||0));
  const open=state.trades.filter(t=>t.status==="open"), upl=open.reduce((s,t)=>s+(+t.upl_usd||0),0);
  const wins=closed.filter(t=>t.result==="win").length;
  $("#hero").innerHTML=`<div class="row between"><div class="k">Total result (closed trades)</div><span class="tag">${closed.length} closed · ${open.length} open</span></div>
    <div class="big ${cum>=0?"pos":"neg"}" id="pl">$0.00</div>
    <small class="soft">${closed.length?`${wins} wins · ${closed.length-wins} losses`:"No closed trades yet: the first results land here."}${open.length?` · open now ${money(upl)}`:""}</small>
    <div style="margin-top:10px">${areaChart(curve.length?curve:[0,0])}</div>`;
  countUp($("#pl"),cum);
  const r=state.snap.regime||{}, c=r.crypto||{};
  const post={allow:["ALLOW new trades","pos"],reduce:["REDUCE size","amb"],cash:["CASH only","neg"]}[r.posture]||["not checked","dim"];
  $("#gauges").innerHTML = gauge(r.component_scores?.uptrend_score ?? null, "Stock market", post[0], post[1], "s")
                         + gauge(c.score ?? null, "Crypto market", (c.zone||"not checked").replace("_"," "), c.score>=60?"pos":c.score>=40?"amb":"neg", "c");
  requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll(".needle").forEach(n=>n.style.transform=`rotate(${n.dataset.deg}deg)`),50));
  const by={}; state.trades.forEach(t=>{const b=by[t.asset_class]||(by[t.asset_class]={c:0,o:0,w:0,p:0});if(t.status==="closed"){b.c++;b.p+=+(t.pnl_usd||0);if(t.result==="win")b.w++;}if(t.status==="open")b.o++;});
  const COL={stock:"#60a5fa",forex:"#34d399",commodity:"#f5c451",crypto:"#a78bfa"};
  $("#classes").innerHTML=["forex","commodity","stock","crypto"].map(k=>{const b=by[k]||{c:0,o:0,w:0,p:0};const wr=b.c?Math.round(100*b.w/b.c):null;
    return `<div class="card" onclick="state.cls='${k}';state.st='open';show('trades');renderTrades()" style="cursor:pointer"><div class="row between"><div class="ico ${k}">${ICON[k]}</div>${ring(wr,COL[k])}</div>
      <div style="margin-top:8px;font-weight:700">${CLASSES[k]}</div><div class="${b.p>0?"pos":b.p<0?"neg":"soft"}" style="font-weight:800">${b.c?money(b.p):"—"}</div><small class="soft">${b.o} open · ${b.c} closed</small></div>`;}).join("");
  $("#openList").innerHTML = open.length ? `<div class="k" style="margin:18px 4px 0">Open now</div>`+open.map(tradeCard).join("") : "";
  const j=state.journal[0];
  $("#lastj").innerHTML = j ? `<div class="row between"><div class="k">Latest from the journal</div><button class="tag" onclick="show('journal')">Read all</button></div><h3 style="margin:8px 0 4px;font-size:16px">${esc(j.title)}</h3><div class="md">${md(j.body_md.slice(0,900))}${j.body_md.length>900?"…":""}</div>` : `<div class="empty">The journal appears here after the first run.</div>`;
}
function chips(el, map, key, counts){
  el.innerHTML = Object.entries(map).map(([k,v])=>`<button class="chip ${state[key]===k?"on":""}" data-k="${k}">${key==="cls"&&k!=="all"?ICON[k].replace(/width="22" height="22"/,'width="14" height="14"'):""}${v}${counts&&counts[k]!=null?` <span class="n">${counts[k]}</span>`:""}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{state[key]=b.dataset.k;renderTrades();});
}
function renderTrades(){
  const inCls=t=>state.cls==="all"||t.asset_class===state.cls;
  const cnt={}; Object.keys(STATUSES).forEach(s=>cnt[s]=state.trades.filter(t=>inCls(t)&&(s==="all"||t.status===s)).length);
  chips($("#cls"), CLASSES, "cls"); chips($("#sts"), STATUSES, "st", cnt);
  const list = state.trades.filter(t=>inCls(t)&&(state.st==="all"||t.status===state.st)).sort((a,b)=>({open:0,proposed:1,closed:2,cancelled:3}[a.status]-{open:0,proposed:1,closed:2,cancelled:3}[b.status])||new Date(b.closed_at||b.opened_at)-new Date(a.closed_at||a.opened_at));
  $("#tlist").innerHTML = list.length ? list.map(tradeCard).join("") : `<div class="card empty">Nothing ${STATUSES[state.st].toLowerCase()} here yet.</div>`;
}
function renderJournal(){
  $("#jlist").innerHTML = state.journal.map((e,i)=>`<div style="position:relative"><span class="dot"></span><details class="card" ${i===0?"open":""}><summary style="cursor:pointer;list-style:none"><small class="soft">${esc(e.day)}</small><div style="font-weight:700">${esc(e.title.replace(/^\d{4}-\d{2}-\d{2}\s*/,"").replace(/^[:(—-]\s*/,"")||e.title)}</div></summary><div class="md">${md(e.body_md)}</div></details></div>`).join("") || `<div class="card empty">No journal yet.</div>`;
}
function renderScores(){
  const sm=(state.snap.scoreboard||{}).markdown||"";
  const rows=[...sm.matchAll(/^\|\s*([^|]+?)\s*\|.*?\*\*([\d.]+)\s*%\*\*/gm)].map(m=>({d:m[1].replace(/\*/g,"").slice(0,22),v:+m[2]}));
  $("#scoreChart").innerHTML = rows.length ? rows.map(r=>`<div style="margin:10px 0"><div class="row between"><small class="soft">${esc(r.d)}</small><b class="${r.v>=95?"pos":r.v>=80?"amb":"neg"}">${r.v}%</b></div>
     <div style="height:8px;background:#223043;border-radius:5px;overflow:hidden"><div style="height:100%;width:0;background:${r.v>=95?"var(--green)":r.v>=80?"var(--amber)":"var(--red)"};border-radius:5px;transition:width 1.2s ease" data-w="${r.v}"></div></div></div>`).join("") : `<div class="empty">No sessions scored yet.</div>`;
  setTimeout(()=>document.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%"),60);
  $("#lessons").innerHTML = md((state.snap.lessons||{}).markdown);
}

/* ---------- results ---------- */
function renderResults(){
  chips($("#rcls"), CLASSES, "rcls"); $("#rcls").querySelectorAll("button").forEach(b=>b.onclick=()=>{state.rcls=b.dataset.k;renderResults();});
  const C=state.trades.filter(t=>t.status==="closed"&&(state.rcls==="all"||t.asset_class===state.rcls));
  const gains=C.filter(t=>t.pnl_usd>0).reduce((s,t)=>s+ +t.pnl_usd,0), losses=C.filter(t=>t.pnl_usd<0).reduce((s,t)=>s+ +t.pnl_usd,0), net=gains+losses;
  const wins=C.filter(t=>t.pnl_usd>0).length, pf=losses?gains/Math.abs(losses):null;
  $("#rhero").innerHTML=`<div class="k">Net result${state.rcls!=="all"?" · "+CLASSES[state.rcls]:""}</div><div class="big ${net>=0?"pos":"neg"}">${money(net)}</div>
    <small class="soft">${C.length} closed trades · ${C.length?Math.round(100*wins/C.length):0}% winners${pf!=null?` · profit factor ${pf.toFixed(2)}`:""}</small>
    <div style="display:flex;height:12px;border-radius:7px;overflow:hidden;margin-top:12px;background:#223043"><div style="width:${gains+Math.abs(losses)?100*gains/(gains+Math.abs(losses)):0}%;background:var(--green);transition:width 1s"></div><div style="flex:1;background:${losses?"var(--red)":"transparent"}"></div></div>`;
  $("#rsplit").innerHTML=`<div class="card"><div class="k">Gained</div><div class="pos" style="font-size:24px;font-weight:800">${money(gains)}</div><small class="soft">${wins} winning trades</small></div>
    <div class="card"><div class="k">Lost</div><div class="neg" style="font-size:24px;font-weight:800">${money(losses)}</div><small class="soft">${C.length-wins} losing trades</small></div>`;
  const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-13+i);return d;});
  const byDay=days.map(d=>C.filter(t=>t.closed_at&&new Date(t.closed_at).toDateString()===d.toDateString()).reduce((s,t)=>s+ +t.pnl_usd,0));
  const mx=Math.max(1,...byDay.map(Math.abs));
  $("#rdays").innerHTML=`<svg viewBox="0 0 280 110" width="100%" height="120"><line x1="0" x2="280" y1="55" y2="55" stroke="#223043"/>${byDay.map((v,i)=>{const h=Math.abs(v)/mx*48,x=i*20+3;return `<rect x="${x}" y="${v>=0?55-h:55}" width="14" height="${Math.max(h,v?2:0)}" rx="3" fill="${v>=0?"#34d399":"#f87171"}"><animate attributeName="height" from="0" to="${Math.max(h,v?2:0)}" dur=".8s" fill="freeze"/></rect>`}).join("")}
    <text x="0" y="108" font-size="9" fill="#5d6f84">${days[0].toLocaleDateString([], {day:"numeric",month:"short"})}</text><text x="280" y="108" font-size="9" fill="#5d6f84" text-anchor="end">today</text></svg>`;
  $("#rclass").innerHTML=["forex","commodity","stock","crypto"].map(k=>{const T=state.trades.filter(t=>t.status==="closed"&&t.asset_class===k);const n=T.reduce((s,t)=>s+ +t.pnl_usd,0);
    return `<div class="row between" style="margin:10px 0"><div class="row"><div class="ico ${k}" style="width:30px;height:30px">${ICON[k].replace(/22/g,"16")}</div>${CLASSES[k]} <small class="soft">${T.length}</small></div><b class="${n>0?"pos":n<0?"neg":"soft"}">${T.length?money(n):"—"}</b></div>`;}).join("")
    + (()=>{const L=C.filter(t=>t.side==="buy"),S=C.filter(t=>t.side==="sell"),sum=a=>a.reduce((s,t)=>s+ +t.pnl_usd,0);
      return `<div class="row between" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px"><span>Long (buy) <small class="soft">${L.length}</small></span><b class="${sum(L)>=0?"pos":"neg"}">${L.length?money(sum(L)):"—"}</b></div>
      <div class="row between" style="margin-top:8px"><span>Short (sell) <small class="soft">${S.length}</small></span><b class="${sum(S)>=0?"pos":"neg"}">${S.length?money(sum(S)):"—"}</b></div>`})();
  const sorted=[...C].sort((a,b)=>b.pnl_usd-a.pnl_usd);
  $("#rbest").innerHTML=C.length?`<div class="k">Best and worst</div><div class="row between" style="margin-top:8px"><span>🏆 ${esc(sorted[0].instrument.replace("_","/"))} ${sorted[0].side}</span><b class="pos">${money(sorted[0].pnl_usd)}</b></div><div class="row between" style="margin-top:6px"><span>⚠️ ${esc(sorted.at(-1).instrument.replace("_","/"))} ${sorted.at(-1).side}</span><b class="neg">${money(sorted.at(-1).pnl_usd)}</b></div>`:`<div class="empty">Results appear as trades close.</div>`;
}

/* ---------- live figures (Capital.com demo, read-only) ---------- */
const EPIC=i=>({XAU_USD:"GOLD",XAG_USD:"SILVER"}[i]||i.replace("_",""));
async function pollLive(){
  const open=state.trades.filter(t=>t.status==="open"); if(!open.length||document.hidden) return;
  const {data:{session}}=await sb.auth.getSession(); if(!session) return;
  const epics=[...new Set(open.map(t=>EPIC(t.instrument)))].join(",");
  try{
    const r=await fetch(`${window.TM.SUPABASE_URL}/functions/v1/live?epics=${epics}`,{headers:{Authorization:"Bearer "+session.access_token,apikey:window.TM.SUPABASE_ANON_KEY}});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||r.status);
    state.live=j; state.liveAt=Date.now();
    const byDeal=Object.fromEntries(j.positions.map(p=>[p.dealId,p]));
    open.forEach(t=>{
      const p=t.deal_id&&byDeal[t.deal_id];
      if(p){ t.last_price=(p.direction==="BUY"?p.bid:p.offer); t.upl_usd=+p.upl; return; }
      const q=j.prices[EPIC(t.instrument)]; if(!q) return;
      const px=t.side==="buy"?q.bid:q.offer, risk=Math.abs(t.entry-t.stop)||1;
      t.last_price=px; if(t.risk_usd) t.upl_usd=+(((t.side==="buy"?px-t.entry:t.entry-px)/risk)*t.risk_usd).toFixed(2);
    });
    const a=j.account||{};
    $("#liveAcct").classList.remove("hidden");
    $("#liveAcct").innerHTML=`<div class="row between"><div class="k">Capital.com demo · live</div><span class="tag"><span class="live" style="display:inline-block;margin-right:5px"></span>${new Date(j.at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})}</span></div>
      <div class="row between" style="margin-top:8px"><div><small class="soft">Balance</small><div style="font-weight:800;font-size:20px">${esc(a.currency||"")} ${(+a.balance||0).toLocaleString()}</div></div>
      <div style="text-align:right"><small class="soft">Open P/L</small><div style="font-weight:800;font-size:20px" class="${(+a.pnl||0)>=0?"pos":"neg"}">${(+a.pnl||0)>=0?"+":""}${(+a.pnl||0).toFixed(2)}</div></div></div>
      <small class="soft">${j.positions.length} open demo position${j.positions.length===1?"":"s"} · updates every 15 s while the app is open</small>`;
    if(state.view==="home") renderHome(); if(state.view==="trades") renderTrades();
  }catch(e){ $("#liveAcct").classList.remove("hidden"); $("#liveAcct").innerHTML=`<div class="k">Live figures</div><small class="amb">Not available yet: ${esc(String(e.message||e))}</small>`; }
}

async function load(){
  const [tr, jr, sn, ap] = await Promise.all([
    sb.from("trades").select("*").order("opened_at",{ascending:false}).limit(500),
    sb.from("journal").select("*").order("day",{ascending:false}).limit(60),
    sb.from("snapshots").select("*"), sb.from("approvals").select("*")]);
  if(tr.error){ $("#updated").textContent = "error"; toast(tr.error.message); return; }
  state.trades=tr.data; state.journal=jr.data||[]; state.snap=Object.fromEntries((sn.data||[]).map(r=>[r.key,r.data]));
  state.approvals=Object.fromEntries((ap.data||[]).map(r=>[r.trade_id,r]));
  renderPending(); renderHome(); renderTrades(); renderResults(); renderJournal(); renderScores(); notifyNew(tr.data); pollLive();
  $("#updated").textContent = new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  deepLink();
}
function deepLink(){
  const m=location.hash.match(/t=([^&]+)/); if(!m) return; const id=decodeURIComponent(m[1]); history.replaceState(null,"",location.pathname);
  const p=document.getElementById("pend-"+id); if(p){window.scrollTo({top:0});p.classList.add("flash");return;}
  const t=state.trades.find(x=>x.id===id); if(!t) return; state.cls="all"; state.st=t.status; show("trades"); renderTrades();
  setTimeout(()=>{const el=document.getElementById("t-"+id); if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("flash");}},200);
}
function notifyNew(rows){
  const first=!Object.keys(state.seen).length;
  rows.forEach(t=>{ if(state.seen[t.id]!==t.status && !first && t.status!=="cancelled" && "Notification" in window && Notification.permission==="granted"){
      new Notification(`${CLASSES[t.asset_class]}: ${t.side.toUpperCase()} ${t.instrument} ${t.status}`, {body: t.status==="closed" ? `${t.result} ${money(t.pnl_usd)}` : `Entry ${t.entry} · stop ${t.stop} · target ${t.target}`, icon:"icon-192.png"});}
    state.seen[t.id]=t.status; });
  localStorage.setItem("tm_seen", JSON.stringify(state.seen));
}
async function start(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ $("#login").classList.remove("hidden"); return; }
  $("#login").classList.add("hidden"); $("#nav").classList.remove("hidden"); show("home");
  if("Notification" in window && Notification.permission==="default") Notification.requestPermission();
  await load(); setInterval(load, 60000); setInterval(pollLive, 15000);
  sb.channel("live").on("postgres_changes",{event:"*",schema:"public",table:"trades"},()=>load()).subscribe();
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
  window.addEventListener("hashchange", deepLink);
}
sb.auth.onAuthStateChange((ev)=>{ if(ev==="SIGNED_IN" && /access_token|code=/.test(location.href)) location.replace(location.href.split("#")[0].split("?")[0]); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
start();
</script>
